name: offline-and-pgvector
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RAG_TEST_PG_DSN: postgresql://rag:local-demo-only@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - name: Evaluate offline dev baselines
        run: python evaluate.py --split dev --out reports/ci-dev.json
      - name: Add evaluation to job summary
        if: always()
        shell: bash
        run: |
          if test -f reports/ci-dev.md; then
            cat reports/ci-dev.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload synthetic evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-dev-evaluation-${{ github.sha }}
          path: |
            reports/ci-dev.json
            reports/ci-dev.md
          if-no-files-found: warn
          retention-days: 14

