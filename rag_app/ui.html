<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业知识问答</title>
<style>body{font:16px system-ui;background:#eff4f7;color:#17324d;max-width:960px;margin:40px auto;padding:0 24px}section{background:white;padding:24px;margin:20px 0;border-radius:14px}input,textarea,select{box-sizing:border-box;padding:12px;width:100%;margin:8px 0;border:1px solid #cbd5df;border-radius:6px}button{background:#087f79;color:white;padding:12px 20px;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#607184}a{color:#067871}</style>
<h1>企业知识问答</h1><p class="hint">依据你可查看的资料回答，并提供原文出处。当前为合成资料演示。</p>
<section><label>访问凭证<input id="token" type="password" autocomplete="off" placeholder="输入本地演示凭证"></label>
<label>问题<textarea id="query">差旅报销和入职材料分别有什么要求？</textarea></label>
<label>检索方式<select id="method"><option value="keyword">关键词基线</option><option value="hash-vector">词项向量对照（离线）</option><option value="pgvector">数据库向量检索（需配置）</option></select></label>
<p id="mode" class="hint">正在识别运行模式…</p><button id="agent">让 Agent 完成问题</button><button id="ask">查阅资料</button><button id="ticket">查询我的工单 T1001</button></section>
<section><h2>回答</h2><pre id="answer">输入问题后开始。</pre><div id="citations"></div><p id="meta" class="hint"></p></section>
<section id="source-section" hidden><h2>引用原文</h2><pre id="source"></pre></section>
<script>
const el=id=>document.getElementById(id);
fetch('/capabilities').then(r=>r.json()).then(r=>{el('mode').textContent=r.planner==='real'?'真实模型 Agent · '+r.synthesis:'离线脚本：单步路由，不进行模型自主规划';});
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Authorization':'Bearer '+el('token').value,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.detail||r.status);return data;}
el('ask').onclick=async()=>{el('ask').disabled=true;el('answer').textContent='正在查阅…';el('citations').replaceChildren();el('source-section').hidden=true;try{const r=await api('/ask',{query:el('query').value,method:el('method').value,top_k:4});el('answer').textContent=r.answer;el('meta').textContent='索引版本 '+r.index_version+' · '+r.latency_ms+' ms · '+r.generation_model;for(const c of r.citations){const b=document.createElement('button');b.textContent=c.title+' · v'+c.version+' · '+c.location;b.style.margin='6px';b.onclick=async()=>{el('source-section').hidden=false;try{const s=await api(c.url);el('source').textContent=s.text;}catch(e){el('source').textContent='原文已不可访问：'+e.message;}};el('citations').append(b);}}catch(e){el('answer').textContent='无法完成：'+e.message;}finally{el('ask').disabled=false;}};
el('ticket').onclick=async()=>{try{const r=await api('/agent',{query:'/ticket T1001',method:'keyword',top_k:4});el('answer').textContent=JSON.stringify(r.results,null,2);}catch(e){el('answer').textContent=e.message;}};
el('agent').onclick=async()=>{el('agent').disabled=true;el('citations').replaceChildren();el('answer').textContent='正在处理…';try{const r=await api('/agent',{query:el('query').value,method:el('method').value});el('answer').textContent=r.answer;el('meta').textContent='模式 '+r.planner+' · 工具 '+r.trace.map(t=>t.tool).join(' → ')+' · 工作流 '+r.workflow_id+' · 模型 '+r.synthesis_model;for(const c of r.citations){const b=document.createElement('button');b.textContent='['+c.evidence_id+'] '+c.title;b.onclick=async()=>{el('source-section').hidden=false;try{el('source').textContent=(await api(c.url)).text;}catch(e){el('source').textContent=e.message;}};el('citations').append(b);}}catch(e){el('answer').textContent='无法完成：'+e.message;}finally{el('agent').disabled=false;}};
</script></html>
