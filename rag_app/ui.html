<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业知识助手</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17324d;background:#f1f5f8}*{box-sizing:border-box}body{max-width:1080px;margin:32px auto;padding:0 22px}h1{margin-bottom:8px}section{background:white;border:1px solid #dce5eb;padding:24px;border-radius:14px;margin:18px 0}label{display:block;margin:12px 0}input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid #bdcdd9;border-radius:7px;margin-top:6px}textarea{min-height:85px}button{font:inherit;background:#126b69;color:white;border:0;border-radius:7px;padding:10px 15px;margin:5px 7px 5px 0;cursor:pointer}button.secondary{background:#e6eff2;color:#17324d}button:disabled{opacity:.5;cursor:default}.muted{color:#5e7485;font-size:14px}.row{display:flex;gap:16px}.row>*{flex:1}.message{border-left:3px solid #a9ceca;padding:12px 18px;background:#f7fafb;margin:18px 0;white-space:pre-wrap;overflow-wrap:anywhere}.doc{border-bottom:1px solid #dce5eb;padding:16px 0}input[type=checkbox]{width:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}nav{margin-top:20px}nav button{background:#e6eff2;color:#17324d}nav button.active{background:#126b69;color:white}[hidden]{display:none!important}@media(max-width:650px){.row{display:block}body{margin:18px auto}section{padding:16px}}
</style></head><body>
<h1>RAG 与 Agent 展示</h1><p class="muted">个人学习项目 · 合成资料演示 · 检索、证据、引用和工具流程。</p>
<section><label>访问凭证<input id="token" type="password" autocomplete="off" placeholder="输入本机用户凭证"></label><button id="load">载入我的会话和资料</button><span id="status" class="muted">凭证仅保留在当前页面。</span></section>
<nav><button data-tab="chat" class="active">知识问答</button><button data-tab="documents">我的资料</button><button data-tab="feedback">反馈与评测</button><button data-tab="privacy">数据管理</button></nav>
<section id="chat"><div class="row"><label>会话<select id="conversation"><option value="">新会话</option></select></label><label>检索方式<select id="method"><option value="bm25">BM25 关键词检索</option><option value="hybrid-local">离线混合检索</option><option value="hybrid">语义混合检索（需配置）</option><option value="pgvector">向量检索（需配置）</option><option value="keyword">旧关键词基线</option></select></label></div>
<button id="new" class="secondary">新会话</button><button id="delete-conversation" class="secondary">删除当前会话</button>
<label><input id="rerank" type="checkbox" disabled> 对候选资料重排序（需配置）</label>
<div id="messages"><p class="muted">可先问“差旅报销的规定是什么？”，再追问“那期限是几天？”。</p></div>
<label>问题<textarea id="query" placeholder="输入问题或接着追问"></textarea></label><button id="send">发送</button><button id="agent" class="secondary">单次 Agent 任务</button><p id="check" class="muted"></p>
<div id="feedback-box" hidden><p>这次回答是否有帮助？</p><button id="helpful">有帮助</button><button id="unhelpful" class="secondary">需要改进</button><label>补充说明<textarea id="comment" placeholder="可填写遗漏、错误或建议"></textarea></label></div>
</section>
<section id="documents" hidden><h2>资料管理</h2><p class="muted">支持 PDF、Word、Markdown 和文本。单次上传不超过 10 MB，默认仅自己可见。扫描 PDF 需先完成文字识别。</p>
<label>选择新建或更新<select id="update-document"><option value="">上传新资料</option></select></label><label>资料标题<input id="doc-title" maxlength="200"></label><label>文件<input id="file" type="file" accept=".pdf,.docx,.md,.txt"></label><label>共享给我的分组（可选，用英文逗号分隔；public 表示租户内公开）<input id="groups" placeholder="留空表示仅自己可见"></label>
<label><input id="reindex" type="checkbox"> 上传后更新向量索引（已配置模型时可能产生调用费用）</label><button id="upload">上传并保存</button><button id="refresh-documents" class="secondary">刷新资料</button><p id="upload-status" class="muted"></p><div id="document-list"></div>
</section>
<section id="feedback" hidden><h2>反馈与评测</h2><p class="muted">反馈保存在本机数据库，不会自动作为模型训练数据。标注并确认后，可导出为评测集。</p><button id="refresh-feedback">查看我的反馈</button><button id="export-feedback" class="secondary">导出反馈 JSON</button><div id="feedback-list"></div></section>
<section id="privacy" hidden><h2>个人记录管理</h2><p class="muted">先导出或预览，再决定是否清理。停止正在执行的请求后操作。访问凭证、正在处理的任务和活跃资料会保留。</p><button id="export-personal">导出我的记录</button><label>保留最近多少天<input id="retention-days" type="number" min="1" max="3650" value="30"></label><label><input id="clear-all" type="checkbox"> 清理我的全部会话、回答与反馈记录</label><label><input id="prune-versions" type="checkbox"> 同时清理我拥有的非活跃资料旧版本（保留最新 2 个版本）</label><button id="preview-cleanup">预览清理范围</button><button id="apply-cleanup" class="secondary" disabled>确认清理</button><pre id="cleanup-preview"></pre></section>
<section id="source-section" hidden><h2>引用原文</h2><pre id="source"></pre></section>
<script>
const el=id=>document.getElementById(id);let lastAnswer=null;let documentRows=[];
function textNode(tag,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node;}
async function api(path,body,method){const headers={Authorization:'Bearer '+el('token').value};const options={method:method||(body===undefined?'GET':'POST'),headers};if(body instanceof FormData)options.body=body;else if(body!==undefined){headers['Content-Type']='application/json';options.body=JSON.stringify(body);}const response=await fetch(path,options);const value=await response.json();if(!response.ok)throw new Error(value.detail||'请求失败');return value;}
function failure(error){el('status').textContent='操作未完成：'+error.message;}
for(const button of document.querySelectorAll('[data-tab]'))button.onclick=()=>{for(const item of document.querySelectorAll('[data-tab]'))item.classList.toggle('active',item===button);for(const id of ['chat','documents','feedback','privacy'])el(id).hidden=id!==button.dataset.tab;};
fetch('/capabilities').then(r=>r.json()).then(r=>{el('rerank').disabled=!r.reranker;}).catch(failure);
async function loadConversations(selectId){const response=await api('/conversations');el('conversation').replaceChildren(new Option('新会话',''));for(const row of response.conversations)el('conversation').append(new Option(row.created.slice(0,16).replace('T',' ')+' · '+row.version+' 轮',row.id));if(selectId)el('conversation').value=selectId;}
function showAnswer(query,result){const box=textNode('div','', 'message');box.append(textNode('strong',query),textNode('p',result.answer));for(const citation of result.citations||[]){const button=textNode('button',citation.title+' · '+citation.location,'secondary');button.onclick=async()=>{el('source-section').hidden=false;try{el('source').textContent=(await api(citation.url||('/citations/'+citation.chunk_id))).text;}catch(error){el('source').textContent='原文已不可访问：'+error.message;}};box.append(button);}if(result.clarification?.choices?.length){for(const choice of result.clarification.choices){const b=textNode('button',choice,'secondary');b.onclick=()=>{el('query').value=choice+'的规定是什么？';el('query').focus();};box.append(b);}}
const trace=result.retrieval_trace;const correction=trace?.correction;if(correction){const details=textNode('details','');details.append(textNode('summary','查看检索过程'));for(let i=0;i<correction.attempts.length;i++){const attempt=correction.attempts[i];details.append(textNode('p',(i===0?'首次检索：':'改写重试：')+attempt.query+' · '+(attempt.status==='accepted'?'证据可用':'证据不足'),'muted'));}if(trace.section_context_chunk_ids?.length)details.append(textNode('p','已补充同一章节的 '+trace.section_context_chunk_ids.length+' 个相邻片段。','muted'));box.append(details);}el('messages').append(box);if(result.query_rewritten)el('check').textContent='已结合当前可访问的前文资料理解追问。';else el('check').textContent=result.refused?'资料不足，已拒答或请求补充。':'已提供可核对的来源；请继续检查回答是否完整。';}
el('load').onclick=async()=>{try{lastAnswer=null;el('feedback-box').hidden=true;el('messages').replaceChildren();el('source-section').hidden=true;await loadConversations();await loadDocuments();el('status').textContent='已载入。切换用户后请重新点击此按钮。';}catch(error){failure(error);}};
el('new').onclick=()=>{el('conversation').value='';el('messages').replaceChildren();lastAnswer=null;el('feedback-box').hidden=true;};
el('conversation').onchange=async()=>{el('messages').replaceChildren();lastAnswer=null;el('feedback-box').hidden=true;if(!el('conversation').value)return;try{const r=await api('/conversations/'+el('conversation').value);for(const turn of r.turns)showAnswer(turn.query,turn.result);}catch(error){failure(error);}};
el('delete-conversation').onclick=async()=>{if(!el('conversation').value||!confirm('删除这个会话及其对话记录？'))return;try{await api('/conversations/'+el('conversation').value,undefined,'DELETE');el('new').click();await loadConversations();}catch(error){failure(error);}};
el('send').onclick=async()=>{const query=el('query').value.trim();if(!query)return;el('send').disabled=true;el('check').textContent='正在查阅资料与检查证据…';try{const body={query,method:el('method').value,rerank:el('rerank').checked,top_k:4};if(el('conversation').value)body.conversation_id=el('conversation').value;const result=await api('/chat',body);showAnswer(query,result);await loadConversations(result.conversation_id);lastAnswer=result;el('feedback-box').hidden=false;el('comment').value='';el('query').value='';}catch(error){failure(error);}finally{el('send').disabled=false;}};
el('agent').onclick=async()=>{const query=el('query').value.trim();if(!query)return;el('agent').disabled=true;try{const result=await api('/agent',{query,method:el('method').value,rerank:el('rerank').checked});showAnswer(query,result);lastAnswer=null;el('feedback-box').hidden=true;el('check').textContent='已完成单次 Agent 任务；该任务不追加到多轮会话。';}catch(error){failure(error);}finally{el('agent').disabled=false;}};
async function saveFeedback(rating){if(!lastAnswer)return;try{await api('/feedback',{run_id:lastAnswer.run_id,rating,reason:rating==='helpful'?'correct':'other',comment:el('comment').value});el('status').textContent='反馈已保存。';}catch(error){failure(error);}}
el('helpful').onclick=()=>saveFeedback('helpful');el('unhelpful').onclick=()=>saveFeedback('unhelpful');
async function loadDocuments(){documentRows=(await api('/documents')).documents;el('document-list').replaceChildren();el('update-document').replaceChildren(new Option('上传新资料',''));for(const row of documentRows){const box=textNode('div','', 'doc');box.append(textNode('strong',row.title),textNode('p','版本 '+row.version+' · 资料编号 '+row.document_id+' · '+(row.can_manage?'可管理':'可查阅'),'muted'));if(row.can_manage){el('update-document').append(new Option(row.title+' · v'+row.version,row.document_id));const remove=textNode('button','撤销资料访问','secondary');remove.onclick=async()=>{if(!confirm('撤销后，该资料的旧引用将不可访问。继续？'))return;try{await api('/documents/'+row.document_id,{expected_version:row.version},'DELETE');await loadDocuments();}catch(error){failure(error);}};const index=textNode('button','更新索引','secondary');index.onclick=async()=>{if(!confirm('已配置外部 Embedding 时，更新索引可能产生调用费用。继续？'))return;try{const result=await api('/documents/'+row.document_id+'/index',{});await watchJob(result.job_id);}catch(error){failure(error);}};box.append(remove,index);}el('document-list').append(box);}}
el('update-document').onchange=()=>{const row=documentRows.find(d=>d.document_id===el('update-document').value);if(row)el('doc-title').value=row.title;};
async function watchJob(id){for(let i=0;i<30;i++){const job=await api('/index-jobs/'+id);el('upload-status').textContent='索引任务：'+({queued:'等待处理',running:'处理中',succeeded:'完成',failed:'失败，请检查服务配置'}[job.status]||job.status);if(['succeeded','failed'].includes(job.status))return;await new Promise(resolve=>setTimeout(resolve,1000));}el('upload-status').textContent='任务仍在处理中，可稍后刷新资料或查询任务状态。';}
el('upload').onclick=async()=>{const file=el('file').files[0];if(!file)return;el('upload').disabled=true;try{const body=new FormData();body.append('file',file);body.append('title',el('doc-title').value);body.append('groups',JSON.stringify(el('groups').value.split(',').map(x=>x.trim()).filter(Boolean)));body.append('reindex',el('reindex').checked);const row=documentRows.find(d=>d.document_id===el('update-document').value);if(row){body.append('document_id',row.document_id);body.append('expected_version',row.version);}const result=await api('/documents/upload',body);el('upload-status').textContent=result.changed?'资料已保存，关键词检索可立即使用。':'内容和设置未变化，无需重复更新。';await loadDocuments();if(result.index_job_id)await watchJob(result.index_job_id);}catch(error){failure(error);}finally{el('upload').disabled=false;}};
el('refresh-documents').onclick=()=>loadDocuments().catch(failure);
el('refresh-feedback').onclick=async()=>{try{const data=await api('/feedback');el('feedback-list').replaceChildren(textNode('p','共 '+data.summary.total+' 条反馈，'+data.summary.reviewed+' 条已确认标注。'));for(const row of data.records){const box=textNode('div','', 'doc');box.append(textNode('strong',row.query),textNode('p',row.feedback.rating==='helpful'?'有帮助':'需要改进'),textNode('p',row.answer));const expected=textNode('input','');expected.placeholder='相关文档 ID，用英文逗号分隔';expected.value=row.feedback.expected_doc_ids.join(',');const refused=textNode('input','');refused.type='checkbox';refused.checked=row.feedback.expected_refusal===true;const refusalLabel=textNode('label','期望拒答 ');refusalLabel.append(refused);const correction=textNode('textarea','');correction.placeholder='可填写修正后的答案';correction.value=row.feedback.corrected_answer;const save=textNode('button','确认标注，用于评测');save.onclick=async()=>{try{await api('/feedback',{...row.feedback,run_id:row.run_id,reviewed:true,expected_refusal:refused.checked,expected_doc_ids:expected.value.split(',').map(x=>x.trim()).filter(Boolean),corrected_answer:correction.value});el('status').textContent='标注已确认。';}catch(error){failure(error);}};box.append(expected,refusalLabel,correction,save);el('feedback-list').append(box);}}catch(error){failure(error);}};
el('export-feedback').onclick=async()=>{try{const data=await api('/feedback/export');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='rag-feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(error){failure(error);}};

function downloadJson(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function cleanupSettings(dry_run){return {days:Number(el('retention-days').value),all_personal_records:el('clear-all').checked,prune_document_versions:el('prune-versions').checked,keep_versions:2,dry_run};}
for(const id of ['retention-days','clear-all','prune-versions'])el(id).onchange=()=>{el('apply-cleanup').disabled=true;};
el('export-personal').onclick=async()=>{try{downloadJson(await api('/privacy/export'),'personal-records.json');}catch(error){failure(error);}};
el('preview-cleanup').onclick=async()=>{try{const result=await api('/privacy/cleanup',cleanupSettings(true));const labels={conversations:'会话',answers:'回答记录',feedback:'反馈',completed_jobs:'已结束任务',runs:'运行记录',inactive_document_versions:'非活跃资料旧版本',active_jobs_kept:'保留的处理中任务'};el('cleanup-preview').textContent=Object.entries(result.counts).map(([key,value])=>(labels[key]||key)+'：'+value).join('\n');el('apply-cleanup').disabled=false;}catch(error){failure(error);}};
el('apply-cleanup').onclick=async()=>{if(!confirm('按当前条件重新计算并清理我的记录？此操作不会删除其他用户的记录。'))return;try{await api('/privacy/cleanup',cleanupSettings(false));el('cleanup-preview').textContent='清理完成。';el('apply-cleanup').disabled=true;el('new').click();await loadConversations();}catch(error){failure(error);}};
</script></body></html>
